# =========================================================
# PRODUCTION PROFILE
# =========================================================

server.port=8080

# =========================================================
# MYSQL
# =========================================================

spring.datasource.url=jdbc:mysql://YOUR_PROD_DB_HOST:3306/academy_db?useSSL=true&serverTimezone=Asia/Kolkata
spring.datasource.username=YOUR_PROD_DB_USERNAME
spring.datasource.password=YOUR_PROD_DB_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# =========================================================
# LOGGING
# =========================================================

logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN